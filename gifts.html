<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Planner - Gift List</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="todo.html">To-Do List</a></li>
            <li><a href="grocery.html">Grocery List</a></li>
            <li><a href="gifts.html">Gift List</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main>
        <h1>Gift List</h1>
        <p>Track all the gifts you are planning.</p>

        <section>
            <h2>Gift Items</h2>
            <ul id="gift-list" aria-live="polite"></ul>
        </section>

        <section>
            <h2>Add Gift</h2>
            <form id="gift-add-form">
                <label for="recipient">Recipient:</label>
                <input type="text" id="recipient" name="recipient" required aria-required="true">

                <label for="giftName">Gift:</label>
                <input type="text" id="giftName" name="giftName" required aria-required="true">

                <button type="submit">Add Gift</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2025 Holiday Planner
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
