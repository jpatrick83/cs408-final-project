<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Planner - To-Do List</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="todo.html">To-Do List</a></li>
            <li><a href="grocery.html">Grocery List</a></li>
            <li><a href="gifts.html">Gift List</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main>
        <h1>To-Do List</h1>
        <p>Manage all your holiday tasks.</p>

        <section>
            <h2>All Tasks</h2>
            <ul id="task-list" aria-live="polite"></ul>
        </section>

        <section>
            <h2>Add New Task</h2>
            <form id="task-form">
                <label for="taskInput">Task:</label>
                <input type="text" id="taskInput" name="taskInput" required aria-required="true">

                <label for="taskDate">Date:</label>
                <input type="date" id="taskDate" name="taskDate">

                <button type="submit">Add Task</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2025 Holiday Planner
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
