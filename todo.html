    <h1>To-Do List</h1>
    <p>Manage all your holiday tasks.</p>

    <section>
        <h2>All Tasks</h2>
        <ul id="todo-list"></ul>
    </section>

    <section>
        <h2>Add New Task</h2>
        <form id="todo-form">
            <label>Task:</label><br>
            <input type="text" id="taskName" required><br><br>

            <label>Date:</label><br>
            <input type="date" id="taskDate"><br><br>

            <button type="submit">Add Task</button>
        </form>
    </section>

    <script src="js/main.js"></script>
