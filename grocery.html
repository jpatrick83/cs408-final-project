<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Planner - Grocery List</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="todo.html">To-Do List</a></li>
            <li><a href="grocery.html">Grocery List</a></li>
            <li><a href="gifts.html">Gift List</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main>
        <h1>Grocery List</h1>
        <p>Keep track of everything you need for holiday meals and parties.</p>

        <section>
            <h2>Items</h2>
            <ul id="grocery-list" aria-live="polite"></ul>
        </section>

        <section>
            <h2>Add Grocery Item</h2>
            <form id="grocery-add-form">
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" name="itemName" required aria-required="true">

                <label for="quantity">Quantity:</label>
                <input type="text" id="quantity" name="quantity">

                <label for="notes">Notes:</label>
                <input type="text" id="notes" name="notes">

                <button type="submit">Add Item</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2025 Holiday Planner
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
